<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f140e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Manche">
  <title>Manche</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="masthead">
      <h1>Manche</h1>
      <p>Fretboard note trainer</p>
    </header>

    <main class="play">
      <div class="scoreboard">
        <div class="stat"><span class="label">Score</span><span class="value" id="score">0</span></div>
        <div class="stat"><span class="label" id="bestLabel">Best</span><span class="value" id="best">0</span></div>
        <div class="stat"><span class="label">String</span><span class="value" id="string">–</span></div>
      </div>

      <section class="stage" id="stage" data-phase="idle" aria-label="Note to play">
        <div class="board-wrap">
          <!-- A short stretch of neck from the nut: frets spaced by the real 2^(-1/12) ratio, strings thin to thick. -->
          <svg class="board" viewBox="0 0 600 300" preserveAspectRatio="none" aria-hidden="true">
            <rect class="nut" x="0" y="0" width="12" height="300"/>
            <line class="fret" x1="172" y1="0" x2="172" y2="300"/>
            <line class="fret" x1="325" y1="0" x2="325" y2="300"/>
            <line class="fret" x1="469" y1="0" x2="469" y2="300"/>
            <line class="string" style="stroke-width:1" x1="0" y1="40" x2="600" y2="40"/>
            <line class="string" style="stroke-width:1.3" x1="0" y1="84" x2="600" y2="84"/>
            <line class="string" style="stroke-width:1.7" x1="0" y1="128" x2="600" y2="128"/>
            <line class="string" style="stroke-width:2.2" x1="0" y1="172" x2="600" y2="172"/>
            <line class="string" style="stroke-width:2.8" x1="0" y1="216" x2="600" y2="216"/>
            <line class="string" style="stroke-width:3.4" x1="0" y1="260" x2="600" y2="260"/>
          </svg>
          <div class="ring" id="ring">
            <div class="inlay"><span class="note" id="note">?</span></div>
          </div>
        </div>
        <p class="message" id="message" aria-live="polite"></p>
      </section>

      <div class="tuner">
        <span class="label">Hearing</span>
        <span class="heard is-off" id="heard">Mic off</span>
        <span class="cents" id="cents"></span>
        <span class="meter" aria-hidden="true"><span id="level"></span></span>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="startBtn" type="button">Start</button>
        <button class="btn btn-quiet" id="restartBtn" type="button" disabled>Restart</button>
      </div>

      <section class="speed" aria-label="Speed">
        <div class="speed-head">
          <label class="label" for="tempo">Speed</label>
          <output id="tempoValue" for="tempo"></output>
        </div>
        <input type="range" id="tempo">
        <div class="speed-ends" aria-hidden="true"><span>Slow</span><span>Fast</span></div>
        <div class="accel">
          <button class="btn btn-toggle" id="accelBtn" type="button" aria-pressed="false">Accelerate</button>
          <p class="hint" id="accelHint"></p>
        </div>
      </section>
    </main>

    <aside class="scores" id="scores" data-filter="all">
      <div class="filter">
        <span class="label" id="filterLabel">Show scores for</span>
        <div class="chips" id="filter" role="group" aria-labelledby="filterLabel"></div>
        <div class="chips chips-mode" id="modeFilter" role="group" aria-label="Game mode"></div>
      </div>
      <section>
        <h2>High scores</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th class="num">#</th><th class="num">Score</th><th class="col-string">String</th><th>Speed</th><th>Date</th></tr></thead>
            <tbody id="highBody"></tbody>
          </table>
        </div>
      </section>
      <section>
        <h2>Recent games</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th class="num">Score</th><th class="col-string">String</th><th>Ending</th><th>Speed</th><th>When</th></tr></thead>
            <tbody id="recentBody"></tbody>
          </table>
        </div>
      </section>
    </aside>
  </div>

  <script src="pitch.js"></script>
  <script src="app.js"></script>
</body>
</html>
